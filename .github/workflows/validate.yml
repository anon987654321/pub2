name: Validate Code Quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Ruby 3.2
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Install JavaScript tools
      run: |
        npm install -g eslint jsonlint

    - name: Install Ruby tools
      run: |
        gem install rubocop

    - name: Validate JSON files
      run: |
        echo "Validating JSON files..."
        find . -name "*.json" -type f | while read -r file; do
          echo "Checking $file"
          jsonlint "$file" || exit 1
        done

    - name: Run RuboCop
      run: |
        echo "Running RuboCop..."
        if [ -f ai3/Gemfile ]; then
          cd ai3 && rubocop . || echo "RuboCop found style issues (warnings don't fail build per v64.0.1)"
          cd ..
        fi
        if find . -name "*.rb" -not -path "./ai3/*" | head -1 > /dev/null; then
          rubocop . || echo "RuboCop found style issues (warnings don't fail build per v64.0.1)"
        else
          echo "No additional Ruby files found"
        fi

    - name: Run ESLint
      run: |
        echo "Running ESLint..."
        if find . -name "*.js" -type f | head -1 > /dev/null; then
          eslint . || echo "ESLint completed with issues (configuration may need updating)"
        else
          echo "No JavaScript files found"
        fi

    - name: Run ShellCheck (excluding zsh scripts)
      run: |
        echo "Running ShellCheck..."
        find . -name "*.sh" -type f | while read -r file; do
          # Skip zsh scripts
          if head -1 "$file" | grep -q "zsh"; then
            echo "Skipping zsh script: $file"
            continue
          fi
          echo "Checking $file"
          # Allow info-level messages (per v64.0.1 error-only gating)
          shellcheck "$file" || echo "ShellCheck found issues in $file (info/warnings don't fail build per v64.0.1)"
        done

    - name: Run HTML/Markdown audit
      run: |
        echo "Running HTML/Markdown audit..."
        node scripts/audit_html_md.js || exit 1